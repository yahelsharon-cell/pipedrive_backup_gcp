name: Pipedrive CRM Backup

on:
  schedule:
    - cron: "0 2 * * *" # daily at 02:00 UTC
  workflow_dispatch:

# One backup at a time across scheduled and manual runs; queue rather than cancel.
concurrency:
  group: pipedrive-backup
  cancel-in-progress: false

# Least privilege: every scope not listed here is set to "none".
permissions:
  contents: read
  id-token: write

defaults:
  run:
    shell: bash # explicit shell => runs with `-eo pipefail`

jobs:
  backup:
    name: Backup Pipedrive to GCS
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pipedrive backup
        id: backup
        env:
          PIPEDRIVE_API_TOKEN: ${{ secrets.PIPEDRIVE_API_TOKEN }}
          BACKUP_OUTPUT_DIR: ${{ runner.temp }}/pipedrive-backup
        run: python backup.py

      - name: Verify backup output
        env:
          BACKUP_PATH: ${{ steps.backup.outputs.backup_path }}
        run: |
          if [[ -z "$BACKUP_PATH" || ! -s "$BACKUP_PATH" ]]; then
            echo "::error::backup.py did not report a valid backup_path (got: '${BACKUP_PATH}')"
            exit 1
          fi
          echo "Backup archive: $BACKUP_PATH ($(du -h "$BACKUP_PATH" | cut -f1))"

      # No upload-artifact step: in a public repo, any signed-in GitHub user can
      # download workflow artifacts, and the archive contains CRM personal data.
      # GCS is the only destination for the backup.

      # Authenticate only after third-party Python packages have finished running,
      # so they never have access to GCP credentials.
      - name: Authenticate to Google Cloud (OIDC / Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

      - name: Upload backup to GCS
        env:
          BACKUP_PATH: ${{ steps.backup.outputs.backup_path }}
          GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}
        run: |
          if [[ -z "$GCS_BUCKET_NAME" ]]; then
            echo "::error::GCS_BUCKET_NAME secret is not set"
            exit 1
          fi
          # Object names are timestamped per run, so uploads do not collide.
          gcloud storage cp "$BACKUP_PATH" "gs://$GCS_BUCKET_NAME/"
          echo "Uploaded $(basename "$BACKUP_PATH") to gs://<bucket>/" >> "$GITHUB_STEP_SUMMARY"
